<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام الغيابات</title>
<style>
  :root { --main:#1a73e8; --ok:#188038; --bad:#d93025; --bg:#f3f5f9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: Tahoma, Arial, sans-serif; background:var(--bg); color:#202124; }
  header { background:var(--main); color:#fff; padding:14px; text-align:center; font-size:20px; font-weight:bold; }
  main { max-width:560px; margin:0 auto; padding:12px; }
  .card { background:#fff; border-radius:12px; padding:12px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  label { display:block; font-size:14px; margin:8px 0 4px; color:#555; }
  select { width:100%; padding:11px; font-size:16px; border:1px solid #ccd; border-radius:8px; background:#fff; }
  select:disabled { background:#eef0f3; color:#999; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  button { border:0; border-radius:10px; padding:13px; font-size:16px; font-weight:bold; color:#fff; background:var(--main); cursor:pointer; width:100%; }
  button.green { background:var(--ok); }
  button.red { background:var(--bad); }
  button.gray { background:#6b7280; }
  button:disabled { opacity:.5; }

  /* ===== واجهة البداية ===== */
  #splash { position:fixed; inset:0; z-index:100; color:#fff; text-align:center; padding:24px;
            background:linear-gradient(160deg,#0d47a1 0%,#1a73e8 100%);
            display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .s-title { font-size:36px; font-weight:bold; margin-bottom:16px; }
  .s-dept  { font-size:21px; margin-bottom:12px; }
  .s-name  { font-size:24px; font-weight:bold; letter-spacing:3px; direction:ltr; margin-bottom:38px; }
  .bar { width:min(280px,80%); height:10px; background:rgba(255,255,255,.3); border-radius:10px; overflow:hidden; margin-bottom:16px; }
  .bar > div { height:100%; width:0; background:#fff; border-radius:10px; transition:width .4s ease; }
  #splashStatus { font-size:15px; min-height:22px; margin-bottom:18px; opacity:.95; }
  #btnEnter, #btnRetry { display:none; width:auto; min-width:220px; padding:14px 30px; font-size:19px; background:#fff; color:#0d47a1; }

  /* ===== الكاميرا مربعة ===== */
  #reader { display:none; width:100%; max-width:340px; aspect-ratio:1 / 1; margin:12px auto 0; border-radius:12px; overflow:hidden; background:#000; }
  #reader video { width:100% !important; height:100% !important; object-fit:cover; }

  /* ===== ملخص الاختيارات ===== */
  #selSummary { display:none; line-height:2; font-size:16px; }
  #selSummary b { color:#555; }
  #selSummary span { color:#0d47a1; font-weight:bold; }

  .list { list-style:none; margin:0; padding:0; }
  .list li { display:flex; justify-content:space-between; align-items:center; padding:9px 4px; border-bottom:1px solid #eee; }
  .list small { color:#777; display:block; direction:ltr; text-align:right; }
  .chk { color:var(--ok); font-weight:bold; font-size:22px; margin-inline-end:10px; }
  .x { background:none; color:var(--bad); width:auto; padding:4px 10px; font-size:20px; }
  .count { font-weight:bold; color:var(--ok); }
  #toast { position:fixed; top:70px; left:50%; transform:translateX(-50%); padding:12px 18px; border-radius:10px; color:#fff; font-size:15px; display:none; max-width:90%; text-align:center; z-index:200; }

  /* ===== صفحة المراجعة ===== */
  #viewReview { display:none; }
  .info { font-size:14px; line-height:1.9; }
  .info b { color:#333; }
  .tbl-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { border:1px solid #dde; padding:8px 6px; text-align:center; }
  th { background:#e8eefc; }
  tr.absent td { background:#fdd8d8; font-weight:bold; }
  .summary { margin:8px 0; font-size:14px; }
</style>
</head>
<body>

<!-- ========== واجهة البداية ========== -->
<div id="splash">
  <div class="s-title">نظام الغيابات</div>
  <div class="s-dept">قسم تكنولوجيا الإعلام الرقمي</div>
  <div class="s-name">OMAR INAAM</div>
  <div class="bar" id="bar"><div id="barFill"></div></div>
  <div id="splashStatus">... جاري تحميل بيانات الطلبة</div>
  <button id="btnEnter">دخول إلى النظام</button>
  <button id="btnRetry">إعادة المحاولة</button>
</div>

<header>📋 نظام الغيابات</header>

<!-- ========== الصفحة الرئيسية ========== -->
<main id="viewMain">

  <div class="card" id="selCard">
    <div class="row">
      <div><label>المرحلة</label><select id="stage"></select></div>
      <div><label>الشعبة</label><select id="section"></select></div>
    </div>
    <label>المادة</label><select id="subject"></select>
    <label>نوع المحاضرة</label><select id="type"></select>
  </div>

  <div class="card" id="selSummary">
    <div><b>المرحلة:</b> <span id="sStage"></span></div>
    <div><b>الشعبة:</b> <span id="sSection"></span></div>
    <div><b>المادة:</b> <span id="sSubject"></span></div>
    <div><b>نوع المحاضرة:</b> <span id="sType"></span></div>
  </div>

  <div class="card">
    <button id="btnScan" class="green">📷 فتح الكاميرا ومسح الباركود</button>
    <div id="reader"></div>
    <button id="btnStop" class="red" style="display:none;margin-top:10px">⏹ إيقاف الكاميرا</button>
  </div>

  <div class="card">
    <div>الحاضرون (تم مسحهم): <span class="count" id="cnt">0</span></div>
    <ul class="list" id="list"></ul>
    <div class="row" style="margin-top:12px">
      <button id="btnClear" class="gray">مسح القائمة</button>
      <button id="btnReview">مراجعة الحضور والغياب ◀</button>
    </div>
  </div>
</main>

<!-- ========== صفحة المراجعة ========== -->
<main id="viewReview">
  <div class="card info" id="revInfo"></div>
  <div class="card">
    <div class="summary" id="revSummary"></div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>#</th><th>اسم الطالب</th><th>المرحلة</th><th>الشعبة</th><th>الحالة</th></tr></thead>
        <tbody id="revBody"></tbody>
      </table>
    </div>
  </div>
  <div class="row">
    <button id="btnBack" class="gray">▶ رجوع</button>
    <button id="btnConfirm" class="green">✔ تأكيد وإرسال البيانات</button>
  </div>
  <div style="height:20px"></div>
</main>

<div id="toast"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  /* ====== الإعداد الوحيد المطلوب: الصق رابط Web app هنا ====== */
  var API_URL = 'https://script.google.com/macros/s/AKfycbz226zYe_RlsxD1lWHo6XlQZ5cCQSYUSIpHOYmvRgUwmopPzc4D8gDpRgIXr3xsr67M/exec';   // مثال: https://script.google.com/macros/s/AKfy.../exec
  /* ============================================================ */

  var DATA = { students: [], subjects: [] };
  var byId = {};
  var scanned = [];            // الطلاب الذين تم مسحهم = حاضرون
  var absentToSend = [];       // أرقام الغائبين المحسوبة في صفحة المراجعة
  var scanner = null;
  var lastCode = '', lastTime = 0;

  var $ = function (id) { return document.getElementById(id); };
  var norm = function (s) { return String(s || '').trim().toLowerCase(); };
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------- الرسائل ---------- */
  function toast(msg, ok, ms) {
    var t = $('toast');
    t.textContent = msg;
    t.style.background = ok ? '#188038' : '#d93025';
    t.style.display = 'block';
    clearTimeout(toast._h);
    toast._h = setTimeout(function () { t.style.display = 'none'; }, ms || 2800);
  }

  /* ---------- الصوت (أعلى مستوى ممكن) ---------- */
  var audioCtx = null;
  function initAudio() {
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) audioCtx = new C();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function tone(freq, start, dur, type) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    var t0 = audioCtx.currentTime + start;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(1.0, t0 + 0.005);
    g.gain.setValueAtTime(1.0, t0 + dur - 0.02);
    g.gain.linearRampToValueAtTime(0, t0 + dur);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function beep(ok) {
    try {
      initAudio();
      if (ok) {
        tone(1568, 0,    0.16);
        tone(2093, 0.18, 0.16);
        tone(2637, 0.36, 0.24);
      } else {
        tone(400, 0,    0.22, 'sawtooth');
        tone(400, 0.28, 0.22, 'sawtooth');
      }
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(ok ? 150 : [150, 80, 150]);
  }

  /* ---------- القوائم المنسدلة (تبدأ فارغة) ---------- */
  function fill(sel, arr, placeholder) {
    sel.innerHTML = '';
    var p = document.createElement('option');
    p.value = ''; p.textContent = placeholder;
    sel.appendChild(p);
    arr.forEach(function (v) {
      var o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
    });
    sel.value = '';
  }

  function resetDropdowns() {
    var stages = [];
    DATA.students.forEach(function (x) { if (x.stage && stages.indexOf(x.stage) < 0) stages.push(x.stage); });
    DATA.subjects.forEach(function (x) { if (x.stage && stages.indexOf(x.stage) < 0) stages.push(x.stage); });
    fill($('stage'), stages, 'اختر المرحلة');
    fill($('section'), [], 'اختر الشعبة');
    fill($('subject'), [], 'اختر المادة');
    fill($('type'), ['نظري', 'عملي'], 'اختر النوع');
    $('section').disabled = true;
    $('subject').disabled = true;
    $('type').disabled = true;
  }

  function onStage() {
    var st = norm($('stage').value);
    if (!st) {
      fill($('section'), [], 'اختر الشعبة');
      fill($('subject'), [], 'اختر المادة');
      $('section').disabled = true; $('subject').disabled = true;
      $('type').value = ''; $('type').disabled = true;
      return;
    }
    var secs = [], subs = [];
    DATA.students.forEach(function (s) {
      if (norm(s.stage) === st && secs.indexOf(s.section) < 0) secs.push(s.section);
    });
    DATA.subjects.forEach(function (s) {
      if (norm(s.stage) === st && subs.indexOf(s.name) < 0) subs.push(s.name);
    });
    fill($('section'), secs, 'اختر الشعبة');
    fill($('subject'), subs, 'اختر المادة');
    $('section').disabled = false; $('subject').disabled = false;
    $('type').disabled = false;
  }
  $('stage').addEventListener('change', onStage);

  /* ---------- واجهة البداية وتحميل الطلبة ---------- */
  var progTimer = null;
  function startProgress() {
    var w = 5;
    $('bar').style.display = 'block';
    $('barFill').style.width = w + '%';
    clearInterval(progTimer);
    progTimer = setInterval(function () {
      w += (90 - w) * 0.08;                 // يتقدم تدريجياً حتى 90% ثم ينتظر اكتمال التحميل
      $('barFill').style.width = w + '%';
    }, 200);
  }
  function finishProgress(cb) {
    clearInterval(progTimer);
    $('barFill').style.width = '100%';
    setTimeout(cb, 500);
  }

  function loadData() {
    startProgress();
    $('btnEnter').style.display = 'none';
    $('btnRetry').style.display = 'none';
    $('splashStatus').textContent = '... جاري تحميل بيانات الطلبة';

    if (API_URL.indexOf('PASTE_') === 0) {
      showFail('لم يتم ضبط رابط API_URL داخل index.html');
      return;
    }
    fetch(API_URL + '?action=init')
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { showFail(j.error || 'فشل تحميل البيانات'); return; }
        DATA = j.data;
        byId = {};
        DATA.students.forEach(function (s) { byId[s.id] = s; });
        resetDropdowns();
        finishProgress(function () {
          $('bar').style.display = 'none';
          $('splashStatus').textContent = '';
          $('btnEnter').style.display = 'inline-block';
        });
      })
      .catch(function (e) {
        showFail('تعذر الاتصال بالخادم. تحقق من الرابط ومن الإنترنت');
        console.error(e);
      });
  }
  function showFail(msg) {
    clearInterval(progTimer);
    $('bar').style.display = 'none';
    $('splashStatus').textContent = msg;
    $('btnRetry').style.display = 'inline-block';
  }
  $('btnRetry').onclick = loadData;
  $('btnEnter').onclick = function () {
    initAudio();                                 // تفعيل الصوت بلمسة المستخدم
    $('splash').style.display = 'none';
  };

  /* ---------- عرض الاختيارات: قوائم أو نص ---------- */
  function updateView() {
    var hide = !!scanner || scanned.length > 0;   // الكاميرا مفتوحة أو بدأ التسجيل
    $('selCard').style.display = hide ? 'none' : 'block';
    $('selSummary').style.display = hide ? 'block' : 'none';
    if (hide) {
      $('sStage').textContent = $('stage').value;
      $('sSection').textContent = $('section').value;
      $('sSubject').textContent = $('subject').value;
      $('sType').textContent = $('type').value;
    }
  }

  /* ---------- قائمة الحاضرين ---------- */
  function render() {
    $('cnt').textContent = scanned.length;
    var ul = $('list'); ul.innerHTML = '';
    scanned.forEach(function (s, i) {
      var li = document.createElement('li');
      var d = document.createElement('div');
      var chk = document.createElement('span'); chk.className = 'chk'; chk.textContent = '✔';
      d.appendChild(chk);
      d.appendChild(document.createTextNode(s.name));
      var sm = document.createElement('small'); sm.textContent = s.id; d.appendChild(sm);
      var b = document.createElement('button'); b.className = 'x'; b.textContent = '✕';
      b.onclick = function () { scanned.splice(i, 1); render(); };
      li.appendChild(d); li.appendChild(b); ul.appendChild(li);
    });
    updateView();
  }

  function selectionOk() {
    if (!$('stage').value || !$('section').value || !$('subject').value || !$('type').value) {
      toast('اختر المرحلة والشعبة والمادة ونوع المحاضرة أولاً', false); return false;
    }
    return true;
  }

  function addStudent(raw) {
    var code = String(raw || '').trim();
    var s = byId[code];
    if (!s) { var digits = code.replace(/\D/g, ''); if (byId[digits]) { s = byId[digits]; code = digits; } }
    if (!s) { beep(false); toast('باركود غير مسجل: ' + code, false); return false; }
    if (norm(s.stage) !== norm($('stage').value) || norm(s.section) !== norm($('section').value)) {
      beep(false); toast(s.name + ' ليس من ' + $('stage').value + ' / ' + $('section').value, false); return false;
    }
    if (scanned.some(function (x) { return x.id === s.id; })) {
      beep(false); toast('مضاف مسبقاً: ' + s.name, false); return false;
    }
    scanned.push({ id: s.id, name: s.name });
    beep(true); toast('✔ تمت القراءة: ' + s.name, true, 1000); render();
    return true;
  }

  /* ---------- الكاميرا (مربعة) ---------- */
  function cfg() {
    var F = Html5QrcodeSupportedFormats;
    return {
      formatsToSupport: [F.QR_CODE, F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8,
                         F.UPC_A, F.UPC_E, F.ITF, F.CODABAR, F.DATA_MATRIX],
      useBarCodeDetectorIfSupported: true,
      verbose: false
    };
  }
  function onScan(text) {
    var now = Date.now();
    if (text === lastCode && now - lastTime < 2500) return;
    lastCode = text; lastTime = now;
    addStudent(text);
  }
  $('btnScan').onclick = function () {
    initAudio();
    if (!selectionOk()) return;
    if (scanner) return;
    $('reader').style.display = 'block';
    scanner = new Html5Qrcode('reader', cfg());
    updateView();                                   // إخفاء القوائم وإظهار الاختيارات كنص
    scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        aspectRatio: 1.0,
        qrbox: function (w, h) { var s = Math.floor(Math.min(w, h) * 0.85); return { width: s, height: s }; }
      },
      onScan,
      function () {}
    ).then(function () {
      $('btnScan').style.display = 'none';
      $('btnStop').style.display = 'block';
    }).catch(function (err) {
      scanner = null;
      $('reader').style.display = 'none';
      updateView();                                 // إعادة القوائم عند فشل الكاميرا
      toast('تعذر فتح الكاميرا. تأكد من السماح بالوصول للكاميرا من إعدادات المتصفح', false);
      console.error(err);
    });
  };
  function stopScan() {
    if (!scanner) return Promise.resolve();
    var s = scanner; scanner = null;
    return s.stop().then(function () { s.clear(); }).catch(function () {}).then(function () {
      $('reader').style.display = 'none';
      $('btnScan').style.display = 'block';
      $('btnStop').style.display = 'none';
      updateView();
    });
  }
  $('btnStop').onclick = stopScan;

  /* ---------- مسح القائمة ---------- */
  $('btnClear').onclick = function () {
    if (!scanned.length || confirm('مسح القائمة بالكامل؟')) { scanned = []; render(); }
  };

  /* ---------- صفحة المراجعة ---------- */
  function showMain() {
    $('viewReview').style.display = 'none';
    $('viewMain').style.display = 'block';
    window.scrollTo(0, 0);
  }

  $('btnReview').onclick = function () {
    if (!selectionOk()) return;
    if (!scanned.length && !confirm('لم تمسح أي طالب، سيُسجَّل جميع الطلاب غائبين. متابعة؟')) return;

    stopScan().then(function () {
      var stage = $('stage').value, section = $('section').value;
      var presentIds = {};
      scanned.forEach(function (s) { presentIds[s.id] = true; });

      var roster = DATA.students.filter(function (s) {
        return norm(s.stage) === norm(stage) && norm(s.section) === norm(section);
      });

      var body = $('revBody'); body.innerHTML = '';
      absentToSend = [];
      roster.forEach(function (s, i) {
        var isPresent = !!presentIds[s.id];     // الممسوح = حاضر، وغيره = غائب
        if (!isPresent) absentToSend.push(s.id);
        var tr = document.createElement('tr');
        if (!isPresent) tr.className = 'absent';
        [i + 1, s.name, s.stage, s.section, isPresent ? 'حاضر' : 'غائب'].forEach(function (v) {
          var td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
        });
        body.appendChild(tr);
      });

      $('revInfo').innerHTML =
        '<div><b>المادة:</b> ' + esc($('subject').value) + '</div>' +
        '<div><b>النوع:</b> ' + esc($('type').value) + '</div>' +
        '<div><b>المرحلة / الشعبة:</b> ' + esc(stage) + ' / ' + esc(section) + '</div>';
      $('revSummary').textContent =
        'إجمالي الطلاب: ' + roster.length + ' | حاضر: ' + (roster.length - absentToSend.length) +
        ' | غائب: ' + absentToSend.length;

      $('viewMain').style.display = 'none';
      $('viewReview').style.display = 'block';
      window.scrollTo(0, 0);
    });
  };
  $('btnBack').onclick = showMain;

  /* ---------- تأكيد الإرسال (يُرسل الغائبون فقط) ---------- */
  function resetAll() {
    scanned = []; absentToSend = [];
    resetDropdowns();
    render();
    showMain();
  }

  $('btnConfirm').onclick = function () {
    if (!absentToSend.length) {
      toast('جميع الطلاب حاضرون، لا يوجد غياب لتسجيله', true);
      resetAll();
      return;
    }
    var btn = $('btnConfirm'), back = $('btnBack');
    btn.disabled = true; back.disabled = true; btn.textContent = '... جاري الإرسال';
    var done = function () { btn.disabled = false; back.disabled = false; btn.textContent = '✔ تأكيد وإرسال البيانات'; };

    // نص عادي (text/plain) لتجنب مشاكل CORS مع Apps Script
    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'save',
        payload: {
          stage: $('stage').value, section: $('section').value,
          subject: $('subject').value, type: $('type').value,
          ids: absentToSend
        }
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      done();
      if (!j.ok) { toast('فشل الحفظ: ' + j.error, false); return; }
      var r = j.result;
      var msg = 'تم حفظ ' + r.saved + ' غياب';
      if (r.duplicates) msg += ' | مكرر (سُجل سابقاً): ' + r.duplicates;
      if (r.invalid) msg += ' | غير صالح: ' + r.invalid;
      toast(msg, true);
      resetAll();
    })
    .catch(function (err) {
      done();
      toast('تعذر الاتصال بالخادم، لم يتم الإرسال. القائمة ما زالت محفوظة', false);
      console.error(err);
    });
  };

  resetDropdowns();
  render();
  loadData();
</script>
