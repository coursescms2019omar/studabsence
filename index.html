<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسجيل الغياب</title>
<style>
  :root { --main:#1a73e8; --ok:#188038; --bad:#d93025; --bg:#f3f5f9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: Tahoma, Arial, sans-serif; background:var(--bg); color:#202124; }
  header { background:var(--main); color:#fff; padding:14px; text-align:center; font-size:20px; font-weight:bold; }
  main { max-width:560px; margin:0 auto; padding:12px; }
  .card { background:#fff; border-radius:12px; padding:12px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  label { display:block; font-size:14px; margin:8px 0 4px; color:#555; }
  select, input[type=text], input[type=tel] { width:100%; padding:11px; font-size:16px; border:1px solid #ccd; border-radius:8px; background:#fff; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  button { border:0; border-radius:10px; padding:13px; font-size:16px; font-weight:bold; color:#fff; background:var(--main); cursor:pointer; width:100%; }
  button.green { background:var(--ok); }
  button.red { background:var(--bad); }
  button.gray { background:#6b7280; }
  button:disabled { opacity:.5; }
  #reader { width:100%; margin-top:10px; border-radius:10px; overflow:hidden; }
  .list { list-style:none; margin:0; padding:0; }
  .list li { display:flex; justify-content:space-between; align-items:center; padding:9px 4px; border-bottom:1px solid #eee; }
  .list small { color:#777; display:block; direction:ltr; text-align:right; }
  .x { background:none; color:var(--bad); width:auto; padding:4px 10px; font-size:20px; }
  .count { font-weight:bold; color:var(--bad); }
  #toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); padding:12px 18px; border-radius:10px; color:#fff; font-size:15px; display:none; max-width:90%; text-align:center; z-index:9; }
  .hint { font-size:12px; color:#777; margin-top:6px; }
  #status { text-align:center; font-size:13px; color:#777; padding:6px; }
</style>
</head>
<body>
<header>📋 تسجيل الغياب بالباركود</header>
<main>
  <div id="status">... جاري تحميل البيانات</div>

  <div class="card">
    <div class="row">
      <div><label>المرحلة</label><select id="stage"></select></div>
      <div><label>الشعبة</label><select id="section"></select></div>
    </div>
    <label>المادة</label><select id="subject"></select>
    <label>نوع المحاضرة</label>
    <select id="type"><option value="نظري">نظري</option><option value="عملي">عملي</option></select>
    <div class="hint" id="lockHint" style="display:none">الاختيارات مقفلة أثناء وجود طلاب في القائمة. احفظ أو امسح القائمة لتغييرها.</div>
  </div>

  <div class="card">
    <button id="btnScan" class="green">📷 فتح الكاميرا ومسح الباركود</button>
    <div id="reader"></div>
    <button id="btnStop" class="red" style="display:none;margin-top:10px">⏹ إيقاف الكاميرا</button>

    <label style="margin-top:14px">إذا لم تعمل الكاميرا المباشرة: التقط صورة للباركود</label>
    <input type="file" id="fileScan" accept="image/*" capture="environment">
    <div id="tmpReader" style="display:none"></div>

    <label style="margin-top:14px">أو أدخل رقم الطالب يدوياً</label>
    <div class="row">
      <input type="tel" id="manualId" inputmode="numeric" placeholder="رقم الطالب">
      <button id="btnAdd" style="flex:0 0 90px">إضافة</button>
    </div>
  </div>

  <div class="card">
    <div>الغائبون: <span class="count" id="cnt">0</span></div>
    <ul class="list" id="list"></ul>
    <div class="row" style="margin-top:12px">
      <button id="btnClear" class="gray">مسح القائمة</button>
      <button id="btnSave">💾 حفظ الغياب</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button id="btnReload" class="gray">🔄 تحديث البيانات</button>
      <button id="btnKey" class="gray">🔑 تغيير الرمز</button>
    </div>
  </div>
</main>
<div id="toast"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
  /* ====== الإعداد الوحيد المطلوب: الصق رابط Web app هنا ====== */
  var API_URL = 'https://script.google.com/macros/s/AKfycbz226zYe_RlsxD1lWHo6XlQZ5cCQSYUSIpHOYmvRgUwmopPzc4D8gDpRgIXr3xsr67M/exec';   // مثال: https://script.google.com/macros/s/AKfy.../exec
  /* ============================================================ */

  var DATA = { students: [], subjects: [] };
  var byId = {};
  var scanned = [];
  var scanner = null;
  var lastCode = '', lastTime = 0;
  var KEY = '';
  try { KEY = localStorage.getItem('absKey') || ''; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };
  var norm = function (s) { return String(s || '').trim().toLowerCase(); };

  /* ---------- رسائل ---------- */
  function toast(msg, ok) {
    var t = $('toast');
    t.textContent = msg;
    t.style.background = ok ? '#188038' : '#d93025';
    t.style.display = 'block';
    clearTimeout(toast._h);
    toast._h = setTimeout(function () { t.style.display = 'none'; }, 2800);
  }
  function beep(ok) {
    try {
      var C = window.AudioContext || window.webkitAudioContext;
      var c = new C(), o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.frequency.value = ok ? 880 : 250; g.gain.value = 0.15;
      o.start(); setTimeout(function () { o.stop(); c.close(); }, ok ? 120 : 300);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(ok ? 60 : [80, 60, 80]);
  }

  /* ---------- الاتصال بالخادم ---------- */
  function askKey(force) {
    if (KEY && !force) return true;
    var k = prompt('أدخل رمز الدخول:');
    if (!k) return false;
    KEY = k.trim();
    try { localStorage.setItem('absKey', KEY); } catch (e) {}
    return true;
  }

  function loadData() {
    if (API_URL.indexOf('PASTE_') === 0) {
      $('status').textContent = 'لم يتم ضبط رابط API_URL داخل index.html';
      return;
    }
    if (!askKey(false)) { $('status').textContent = 'مطلوب رمز الدخول'; return; }
    $('status').textContent = '... جاري تحميل البيانات';
    fetch(API_URL + '?action=init&key=' + encodeURIComponent(KEY))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) {
          $('status').textContent = j.error || 'فشل التحميل';
          if (String(j.error).indexOf('رمز') >= 0) { KEY = ''; try { localStorage.removeItem('absKey'); } catch (e) {} }
          toast(j.error || 'فشل التحميل', false);
          return;
        }
        init(j.data);
        $('status').textContent = 'تم تحميل ' + j.data.students.length + ' طالب';
      })
      .catch(function (e) {
        $('status').textContent = 'تعذر الاتصال بالخادم. تحقق من الرابط ومن صلاحية Anyone';
        console.error(e);
      });
  }

  function init(d) {
    DATA = d;
    byId = {};
    d.students.forEach(function (s) { byId[s.id] = s; });
    var stages = [];
    d.students.concat(d.subjects.map(function (x) { return { stage: x.stage }; })).forEach(function (x) {
      if (x.stage && stages.indexOf(x.stage) < 0) stages.push(x.stage);
    });
    fill($('stage'), stages);
    onStage();
  }
  function fill(sel, arr) {
    sel.innerHTML = '';
    arr.forEach(function (v) {
      var o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
    });
  }
  function onStage() {
    var st = norm($('stage').value);
    var secs = [], subs = [];
    DATA.students.forEach(function (s) {
      if (norm(s.stage) === st && secs.indexOf(s.section) < 0) secs.push(s.section);
    });
    DATA.subjects.forEach(function (s) {
      if (norm(s.stage) === st && subs.indexOf(s.name) < 0) subs.push(s.name);
    });
    fill($('section'), secs);
    fill($('subject'), subs);
  }
  $('stage').addEventListener('change', onStage);
  $('btnReload').onclick = function () {
    if (scanned.length && !confirm('القائمة الحالية ستبقى، لكن تحديث البيانات قد يغيّر الاختيارات. متابعة؟')) return;
    loadData();
  };
  $('btnKey').onclick = function () { if (askKey(true)) loadData(); };

  /* ---------- القائمة ---------- */
  function render() {
    $('cnt').textContent = scanned.length;
    var ul = $('list'); ul.innerHTML = '';
    scanned.forEach(function (s, i) {
      var li = document.createElement('li');
      var d = document.createElement('div');
      d.textContent = s.name;
      var sm = document.createElement('small'); sm.textContent = s.id; d.appendChild(sm);
      var b = document.createElement('button'); b.className = 'x'; b.textContent = '✕';
      b.onclick = function () { scanned.splice(i, 1); render(); };
      li.appendChild(d); li.appendChild(b); ul.appendChild(li);
    });
    var lock = scanned.length > 0;
    ['stage', 'section', 'subject', 'type'].forEach(function (id) { $(id).disabled = lock; });
    $('lockHint').style.display = lock ? 'block' : 'none';
  }

  function selectionOk() {
    if (!$('stage').value || !$('section').value || !$('subject').value) {
      toast('اختر المرحلة والشعبة والمادة أولاً', false); return false;
    }
    return true;
  }

  function addStudent(raw) {
    if (!selectionOk()) return false;
    var code = String(raw || '').trim();
    var s = byId[code];
    if (!s) { var digits = code.replace(/\D/g, ''); if (byId[digits]) { s = byId[digits]; code = digits; } }
    if (!s) { beep(false); toast('باركود غير مسجل: ' + code, false); return false; }
    if (norm(s.stage) !== norm($('stage').value) || norm(s.section) !== norm($('section').value)) {
      beep(false); toast(s.name + ' ليس من ' + $('stage').value + ' / ' + $('section').value, false); return false;
    }
    if (scanned.some(function (x) { return x.id === s.id; })) {
      beep(false); toast('مضاف مسبقاً: ' + s.name, false); return false;
    }
    scanned.push({ id: s.id, name: s.name });
    beep(true); toast('✔ ' + s.name, true); render();
    return true;
  }

  /* ---------- الكاميرا ---------- */
  function cfg() {
    var F = Html5QrcodeSupportedFormats;
    return {
      formatsToSupport: [F.QR_CODE, F.CODE_128, F.CODE_39, F.CODE_93, F.EAN_13, F.EAN_8,
                         F.UPC_A, F.UPC_E, F.ITF, F.CODABAR, F.DATA_MATRIX],
      useBarCodeDetectorIfSupported: true,
      verbose: false
    };
  }
  function onScan(text) {
    var now = Date.now();
    if (text === lastCode && now - lastTime < 2500) return;
    lastCode = text; lastTime = now;
    addStudent(text);
  }
  $('btnScan').onclick = function () {
    if (!selectionOk()) return;
    if (scanner) return;
    scanner = new Html5Qrcode('reader', cfg());
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: function (w, h) { return { width: Math.floor(w * 0.9), height: Math.floor(Math.min(h, w) * 0.5) }; } },
      onScan,
      function () {}
    ).then(function () {
      $('btnScan').style.display = 'none';
      $('btnStop').style.display = 'block';
    }).catch(function (err) {
      scanner = null;
      toast('تعذر فتح الكاميرا. اسمح بالوصول للكاميرا أو استخدم "التقاط صورة" بالأسفل', false);
      console.error(err);
    });
  };
  function stopScan() {
    if (!scanner) return Promise.resolve();
    var s = scanner; scanner = null;
    return s.stop().then(function () { s.clear(); }).catch(function () {}).then(function () {
      $('btnScan').style.display = 'block';
      $('btnStop').style.display = 'none';
    });
  }
  $('btnStop').onclick = stopScan;

  $('fileScan').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var h = new Html5Qrcode('tmpReader', cfg());
    h.scanFile(f, false)
      .then(function (t) { addStudent(t); })
      .catch(function () { toast('لم يتم التعرف على الباركود في الصورة', false); })
      .then(function () { try { h.clear(); } catch (x) {} e.target.value = ''; });
  });

  $('btnAdd').onclick = function () {
    var v = $('manualId').value;
    if (v && addStudent(v)) $('manualId').value = '';
  };
  $('manualId').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnAdd').click(); });

  /* ---------- الحفظ ---------- */
  $('btnClear').onclick = function () {
    if (!scanned.length || confirm('مسح القائمة بالكامل؟')) { scanned = []; render(); }
  };
  $('btnSave').onclick = function () {
    if (!scanned.length) { toast('القائمة فارغة', false); return; }
    if (!confirm('حفظ غياب ' + scanned.length + ' طالب؟')) return;
    var btn = $('btnSave'); btn.disabled = true; btn.textContent = '... جاري الحفظ';
    var done = function () { btn.disabled = false; btn.textContent = '💾 حفظ الغياب'; };

    // نرسل نصاً عادياً (text/plain) لتجنب مشاكل CORS مع Apps Script
    fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'save',
        key: KEY,
        payload: {
          stage: $('stage').value, section: $('section').value,
          subject: $('subject').value, type: $('type').value,
          ids: scanned.map(function (s) { return s.id; })
        }
      })
    })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      done();
      if (!j.ok) { toast('فشل الحفظ: ' + j.error, false); return; }
      var r = j.result;
      var msg = 'تم حفظ ' + r.saved + ' طالب';
      if (r.duplicates) msg += ' | مكرر (سُجل سابقاً): ' + r.duplicates;
      if (r.invalid) msg += ' | غير صالح: ' + r.invalid;
      toast(msg, true);
      scanned = []; render();
    })
    .catch(function (err) {
      done();
      toast('تعذر الاتصال بالخادم، لم يتم الحفظ. القائمة ما زالت موجودة', false);
      console.error(err);
    });
  };

  render();
  loadData();
</script>
</body>
</html>
